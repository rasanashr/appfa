<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پیرایشگر - ویرایشگر هوشمند</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: bold;
        }
        textarea, input, select {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
        }
        button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 16px;
            width: 100%;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-area {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
        }
        .keyword {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 4px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #334155;
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .api-status {
            font-size: 12px;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .status-ok { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        h2 { color: #10b981; margin-bottom: 12px; font-size: 1.5rem; }
        .hidden { display: none; }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖊️ پیرایشگر متن هوشمند</h1>
            <p style="color: #94a3b8; margin-top: 8px;">بازنویسی حرفه‌ای با Gemini 2.0</p>
        </div>

        <div class="card">
            <label>🔑 کلید API Gemini</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." value="">
            <div id="apiStatus" class="api-status"></div>
            <small style="color: #64748b;">💡 از https://aistudio.google.com/apikey بگیر</small>
            
            <label style="margin-top: 16px;">🤖 مدل هوش مصنوعی</label>
            <select id="model">
                <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (سریع و جدید)</option>
                <option value="gemini-2.0-flash">Gemini 2.0 Flash (پایدار)</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro (قدرتمند)</option>
            </select>
        </div>

        <div class="card">
            <label>📝 متن ورودی</label>
            <textarea id="inputText" rows="8" placeholder="متن خبر، مقاله یا یادداشت خود را اینجا بنویسید..."></textarea>
            
            <label style="margin-top: 16px;">🎭 لحن نگارش</label>
            <select id="tone">
                <option value="رسمی و خبری">رسمی و خبری</option>
                <option value="تیتر زرد و جذاب">تیتر زرد و جذاب</option>
                <option value="آموزشی و سئو شده">آموزشی و سئو شده</option>
                <option value="موجز و شبکه‌های اجتماعی">موجز و شبکه‌های اجتماعی</option>
            </select>
            
            <button onclick="rewriteText()" id="rewriteBtn">
                🚀 بازنویسی هوشمند
            </button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="color: #94a3b8;">در حال پردازش با Gemini 2.0...</p>
        </div>

        <div id="resultArea" class="card hidden">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        function checkApiKey() {
            const apiKey = document.getElementById('apiKey').value;
            const statusDiv = document.getElementById('apiStatus');
            if (apiKey && apiKey.startsWith('AIza')) {
                statusDiv.innerHTML = '✅ کلید API معتبر است';
                statusDiv.className = 'api-status status-ok';
            } else if (apiKey) {
                statusDiv.innerHTML = '⚠️ فرمت کلید صحیح نیست (باید با AIza شروع شود)';
                statusDiv.className = 'api-status status-error';
            } else {
                statusDiv.innerHTML = '⚠️ لطفاً کلید API را وارد کنید';
                statusDiv.className = 'api-status status-error';
            }
        }

        document.getElementById('apiKey').addEventListener('input', checkApiKey);
        checkApiKey();
        
        async function rewriteText() {
            const text = document.getElementById('inputText').value;
            const tone = document.getElementById('tone').value;
            const apiKey = document.getElementById('apiKey').value;
            const model = document.getElementById('model').value;
            
            if (!text.trim()) {
                alert('لطفاً متن خود را وارد کنید');
                return;
            }
            
            if (!apiKey) {
                alert('لطفاً کلید API را وارد کنید');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('rewriteBtn').disabled = true;
            document.getElementById('resultArea').classList.add('hidden');
            
            try {
                const response = await fetch('/api/rewrite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, tone, apiKey, model })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    let keywordsHtml = '<div style="margin-top: 16px;"><strong>🔑 کلمات کلیدی:</strong><br>';
                    for (let i = 0; i < data.data.keywords.length; i++) {
                        keywordsHtml += '<span class="keyword">#' + data.data.keywords[i] + '</span>';
                    }
                    keywordsHtml += '</div>';
                    
                    const resultHtml = '<h2>📰 ' + data.data.title + '</h2>' +
                        '<div class="result-area">' + data.data.content + '</div>' +
                        keywordsHtml;
                    
                    document.getElementById('resultContent').innerHTML = resultHtml;
                    document.getElementById('resultArea').classList.remove('hidden');
                } else {
                    throw new Error(data.error || 'خطای ناشناخته');
                }
                
            } catch (error) {
                const errorHtml = '<div class="error">❌ خطا: ' + error.message + '</div>';
                document.getElementById('resultContent').innerHTML = errorHtml;
                document.getElementById('resultArea').classList.remove('hidden');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('rewriteBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
